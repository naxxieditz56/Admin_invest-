<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Cadbury Dairy Milk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo i {
      font-size: 50px;
      color: #667eea;
      margin-bottom: 10px;
    }

    .logo h2 {
      color: #2d3748;
      margin-bottom: 5px;
    }

    .logo p {
      color: #718096;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #4a5568;
      margin-bottom: 8px;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-group i {
      position: absolute;
      left: 15px;
      color: #a0aec0;
    }

    .input-group input {
      width: 100%;
      padding: 15px 45px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s ease;
      outline: none;
    }

    .input-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    .login-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .login-btn.loading {
      opacity: 0.7;
      cursor: not-allowed;
    }

    .error-message {
      background: #fee;
      color: #c33;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
    }

    .success-message {
      background: #e8f5e9;
      color: #2e7d32;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .success-message.show {
      display: block;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      color: #667eea;
      text-decoration: none;
      font-size: 13px;
    }

    .links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo">
      <i class="fas fa-crown"></i>
      <h2>Admin Login</h2>
      <p>Enter your credentials to access admin panel</p>
    </div>

    <div id="errorMessage" class="error-message">
      <i class="fas fa-exclamation-circle"></i> <span></span>
    </div>

    <div id="successMessage" class="success-message">
      <i class="fas fa-check-circle"></i> <span></span>
    </div>

    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin()">
      <div class="form-group">
        <label>Email</label>
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="admin@cadbury.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>Password</label>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <i class="fas fa-sign-in-alt"></i> Login
      </button>
    </form>

    <div class="links">
      <a href="#" onclick="forgotPassword()">Forgot Password?</a>
    </div>
  </div>

  <script>
    // Demo credentials
    const ADMIN_CREDENTIALS = {
      email: 'admin@cadbury.com',
      password: 'admin123'
    };

    function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const errorDiv = document.getElementById('errorMessage');
      const successDiv = document.getElementById('successMessage');

      // Hide previous messages
      errorDiv.classList.remove('show');
      successDiv.classList.remove('show');

      // Validate inputs
      if (!email || !password) {
        showError('Please enter both email and password');
        return;
      }

      // Show loading
      loginBtn.classList.add('loading');
      loginBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

      // Simulate API call
      setTimeout(() => {
        if (email === ADMIN_CREDENTIALS.email && password === ADMIN_CREDENTIALS.password) {
          // Success
          const adminData = {
            name: 'Super Administrator',
            role: 'Full Access',
            email: email,
            loginTime: new Date().toISOString()
          };

          // Store in session
          sessionStorage.setItem('adminAuthenticated', 'true');
          sessionStorage.setItem('adminData', JSON.stringify(adminData));

          // Show success
          successDiv.querySelector('span').textContent = 'Login successful! Redirecting...';
          successDiv.classList.add('show');

          // Redirect
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        } else {
          // Error
          showError('Invalid email or password');
          loginBtn.classList.remove('loading');
          loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Login';
        }
      }, 1500);
    }

    function showError(message) {
      const errorDiv = document.getElementById('errorMessage');
      errorDiv.querySelector('span').textContent = message;
      errorDiv.classList.add('show');
    }

    function forgotPassword() {
      const email = document.getElementById('email').value;
      if (email) {
        alert(`Password reset link sent to ${email}`);
      } else {
        alert('Please enter your email address');
      }
    }
  </script>
</body>
</html>

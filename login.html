<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Cadbury Dairy Milk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Animated Background */
    .bg-animation {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .bg-animation .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 20s infinite;
    }

    .bg-animation .circle:nth-child(1) {
      width: 300px;
      height: 300px;
      top: -100px;
      right: -100px;
      animation-delay: 0s;
    }

    .bg-animation .circle:nth-child(2) {
      width: 400px;
      height: 400px;
      bottom: -150px;
      left: -150px;
      animation-delay: -5s;
    }

    .bg-animation .circle:nth-child(3) {
      width: 200px;
      height: 200px;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }
      50% {
        transform: translateY(-20px) rotate(5deg);
      }
    }

    /* Login Container */
    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Logo */
    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo i {
      font-size: 60px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .logo h2 {
      font-size: 24px;
      color: #333;
      margin-bottom: 5px;
    }

    .logo p {
      color: #666;
      font-size: 14px;
    }

    /* Alert Messages */
    .alert {
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .alert.show {
      display: flex;
    }

    .alert.error {
      background: #fee;
      color: #c33;
      border-left: 4px solid #c33;
    }

    .alert.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #2e7d32;
    }

    .alert.warning {
      background: #fff3e0;
      color: #e65100;
      border-left: 4px solid #e65100;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-group i {
      position: absolute;
      left: 15px;
      color: #999;
      font-size: 16px;
    }

    .input-group .toggle-password {
      left: auto;
      right: 15px;
      cursor: pointer;
    }

    .input-group input {
      width: 100%;
      padding: 15px 45px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      font-size: 14px;
      transition: all 0.3s ease;
      outline: none;
    }

    .input-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    /* Login Button */
    .login-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
    }

    .login-btn.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    .login-btn.loading .btn-text {
      display: none;
    }

    .login-btn.loading .btn-loader {
      display: inline-block;
    }

    .btn-loader {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Links */
    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      color: #667eea;
      text-decoration: none;
      font-size: 13px;
      transition: all 0.3s ease;
    }

    .links a:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    /* Security Note */
    .security-note {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #666;
    }

    .security-note i {
      color: #667eea;
      font-size: 18px;
    }

    /* Device Info */
    .device-info {
      margin-top: 15px;
      padding: 10px;
      background: #f8f9fa;
      border-radius: 8px;
      font-size: 11px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .device-info i {
      color: #667eea;
    }
  </style>
</head>
<body>
  <!-- Clear session storage on login page load -->
  <script>
    // Clear any existing admin session when accessing login page
    sessionStorage.removeItem('adminAuthenticated');
    sessionStorage.removeItem('adminToken');
    sessionStorage.removeItem('adminData');
    localStorage.removeItem('adminSession');
    
    // Check if already logged in from another tab
    window.addEventListener('storage', (e) => {
      if (e.key === 'adminSession') {
        if (e.newValue) {
          window.location.href = 'dashboard.html';
        }
      }
    });
  </script>

  <div class="bg-animation">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <div class="login-container">
    <div class="logo">
      <i class="fas fa-crown"></i>
      <h2>Admin Login</h2>
      <p>Enter your credentials to access admin panel</p>
    </div>

    <!-- Alert Message -->
    <div id="alertMessage" class="alert">
      <i class="fas"></i>
      <span id="alertText"></span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin()">
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Email</label>
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="admin@example.com" required autocomplete="off">
        </div>
      </div>

      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required>
          <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Login to Admin Panel</span>
        <span class="btn-loader"></span>
      </button>
    </form>

    <div class="links">
      <a href="#" onclick="forgotPassword()">Forgot Password?</a>
    </div>

    <div class="security-note">
      <i class="fas fa-shield-alt"></i>
      <p>This area is restricted. All login attempts are logged and monitored.</p>
    </div>

    <div class="device-info" id="deviceInfo">
      <i class="fas fa-laptop"></i> 
      <span>Loading device information...</span>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC4nik_P57h9Ks8ryj0pG2xYNX-ePXKXtY",
      authDomain: "shoes-shopping-app-6a1d3.firebaseapp.com",
      databaseURL: "https://shoes-shopping-app-6a1d3-default-rtdb.firebaseio.com",
      projectId: "shoes-shopping-app-6a1d3",
      storageBucket: "shoes-shopping-app-6a1d3.appspot.com",
      messagingSenderId: "816065792865",
      appId: "1:816065792865:web:b1d58fab547f98e4961320",
      measurementId: "G-7BVQVYSMDF"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Get device info on load
    window.addEventListener('load', async () => {
      await getDeviceInfo();
    });

    // Get device information
    async function getDeviceInfo() {
      try {
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();
        
        document.getElementById('deviceInfo').innerHTML = `
          <i class="fas fa-laptop"></i> 
          ${data.city || 'Unknown'}, ${data.country_name || 'Unknown'} | ${new Date().toLocaleString()}
        `;
      } catch (error) {
        document.getElementById('deviceInfo').innerHTML = `
          <i class="fas fa-laptop"></i> 
          Unable to detect location
        `;
      }
    }

    // Toggle password visibility
    function togglePassword() {
      const password = document.getElementById('password');
      const icon = document.querySelector('.toggle-password');
      
      if (password.type === 'password') {
        password.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        password.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Show alert
    function showAlert(type, message) {
      const alert = document.getElementById('alertMessage');
      const icon = alert.querySelector('.fa');
      const text = document.getElementById('alertText');
      
      alert.className = `alert ${type} show`;
      
      switch(type) {
        case 'error':
          icon.className = 'fas fa-exclamation-circle';
          break;
        case 'success':
          icon.className = 'fas fa-check-circle';
          break;
        case 'warning':
          icon.className = 'fas fa-exclamation-triangle';
          break;
      }
      
      text.textContent = message;
      
      setTimeout(() => {
        alert.classList.remove('show');
      }, 5000);
    }

    // Handle login
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');

      if (!email || !password) {
        showAlert('error', 'Please enter both email and password');
        return;
      }

      // Show loading
      loginBtn.classList.add('loading');

      try {
        // Attempt login
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Check if user is admin
        const userDoc = await db.collection('users').doc(user.uid).get();
        
        if (!userDoc.exists) {
          throw new Error('User not found');
        }

        const userData = userDoc.data();
        
        if (userData.role !== 'admin' && userData.role !== 'super_admin') {
          throw new Error('Unauthorized: Admin access required');
        }

        // Check if account is active
        if (userData.status === 'blocked' || userData.status === 'inactive') {
          throw new Error('Account is blocked. Contact super admin.');
        }

        // Set session data - THIS IS CRITICAL
        const sessionData = {
          uid: user.uid,
          email: user.email,
          role: userData.role,
          username: userData.username || 'Admin',
          loginTime: new Date().toISOString(),
          authenticated: true
        };

        // Store in session storage (cleared when browser closes)
        sessionStorage.setItem('adminAuthenticated', 'true');
        sessionStorage.setItem('adminToken', btoa(JSON.stringify(sessionData)));
        sessionStorage.setItem('adminData', JSON.stringify(sessionData));
        
        // Optional: Store in localStorage for "Remember Me" functionality
        if (document.getElementById('rememberMe')?.checked) {
          localStorage.setItem('adminSession', JSON.stringify(sessionData));
        }

        // Log successful login
        await logLoginAttempt(user.email, 'success', user.uid);

        showAlert('success', 'Login successful! Redirecting...');

        // Redirect to admin dashboard
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);

      } catch (error) {
        console.error('Login error:', error);
        
        let errorMessage = 'Login failed: ';
        switch(error.code) {
          case 'auth/user-not-found':
          case 'auth/wrong-password':
            errorMessage += 'Invalid email or password';
            break;
          case 'auth/too-many-requests':
            errorMessage += 'Too many failed attempts. Try again later';
            break;
          case 'auth/user-disabled':
            errorMessage += 'Account disabled';
            break;
          default:
            errorMessage += error.message;
        }

        showAlert('error', errorMessage);
        
        // Log failed attempt
        await logLoginAttempt(email, 'failed', null, error.message);
        
        loginBtn.classList.remove('loading');
      }
    }

    // Log login attempt
    async function logLoginAttempt(email, status, userId = null, error = null) {
      try {
        const response = await fetch('https://ipapi.co/json/');
        const ipData = await response.json();
        
        await db.collection('adminLoginLogs').add({
          email: email,
          userId: userId,
          status: status,
          error: error,
          ip: ipData.ip || 'Unknown',
          location: `${ipData.city || 'Unknown'}, ${ipData.country_name || 'Unknown'}`,
          userAgent: navigator.userAgent,
          timestamp: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (err) {
        console.error('Error logging attempt:', err);
      }
    }

    // Forgot password
    function forgotPassword() {
      const email = document.getElementById('email').value;
      
      if (!email) {
        showAlert('warning', 'Please enter your email address');
        return;
      }

      auth.sendPasswordResetEmail(email)
        .then(() => {
          showAlert('success', 'Password reset email sent! Check your inbox.');
        })
        .catch((error) => {
          showAlert('error', error.message);
        });
    }

    // Check if user is already logged in from another tab
    window.addEventListener('storage', (e) => {
      if (e.key === 'adminSession' && e.newValue) {
        window.location.href = 'dashboard.html';
      }
    });
  </script>
</body>
  </html>

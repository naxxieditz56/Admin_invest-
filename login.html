<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - Cadbury Dairy Milk</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated Background */
    .bg-animation {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .bg-animation .circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 20s infinite;
    }

    .bg-animation .circle:nth-child(1) {
      width: 200px;
      height: 200px;
      top: -50px;
      right: -50px;
    }

    .bg-animation .circle:nth-child(2) {
      width: 300px;
      height: 300px;
      bottom: -100px;
      left: -100px;
      animation-delay: -5s;
    }

    .bg-animation .circle:nth-child(3) {
      width: 150px;
      height: 150px;
      bottom: 50%;
      right: 20%;
      animation-delay: -10s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(10deg); }
    }

    /* Login Container */
    .login-container {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 30px;
      padding: 50px 40px;
      width: 90%;
      max-width: 450px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
      position: relative;
      z-index: 1;
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Logo */
    .login-logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-logo i {
      font-size: 60px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
    }

    .login-logo h2 {
      font-size: 28px;
      color: #333;
      margin-bottom: 5px;
    }

    .login-logo p {
      color: #666;
      font-size: 14px;
    }

    /* Form */
    .form-group {
      margin-bottom: 25px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 8px;
    }

    .input-group {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-group i {
      position: absolute;
      left: 15px;
      color: #999;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .input-group .toggle-password {
      left: auto;
      right: 15px;
      cursor: pointer;
      z-index: 2;
    }

    .input-group .toggle-password:hover {
      color: #667eea;
    }

    .input-group input {
      width: 100%;
      padding: 15px 45px;
      border: 2px solid #e0e0e0;
      border-radius: 15px;
      font-size: 15px;
      transition: all 0.3s ease;
      outline: none;
      background: white;
    }

    .input-group input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
    }

    .input-group input:focus + i {
      color: #667eea;
    }

    /* Security Options */
    .security-options {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .remember-me input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: #667eea;
    }

    .remember-me span {
      color: #555;
      font-size: 14px;
    }

    .forgot-password {
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    .forgot-password:hover {
      color: #764ba2;
      text-decoration: underline;
    }

    /* 2FA Section */
    .two-factor-section {
      margin-bottom: 25px;
      padding: 20px;
      background: #f8f9fa;
      border-radius: 15px;
      display: none;
    }

    .two-factor-section.active {
      display: block;
      animation: slideDown 0.3s ease;
    }

    @keyframes slideDown {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .two-factor-section h4 {
      color: #333;
      margin-bottom: 15px;
      font-size: 16px;
    }

    .otp-inputs {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
    }

    .otp-input {
      width: 50px;
      height: 60px;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      text-align: center;
      font-size: 24px;
      font-weight: 600;
      outline: none;
      transition: all 0.3s ease;
    }

    .otp-input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }

    /* Login Button */
    .login-btn {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border: none;
      border-radius: 15px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .login-btn.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    .login-btn.loading .btn-text {
      display: none;
    }

    .login-btn.loading .btn-loader {
      display: inline-block;
    }

    .btn-loader {
      display: none;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Security Note */
    .security-note {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .security-note i {
      color: #667eea;
      font-size: 20px;
    }

    .security-note p {
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    /* Alert Messages */
    .alert {
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      animation: slideDown 0.3s ease;
    }

    .alert.show {
      display: flex;
    }

    .alert.error {
      background: #fee;
      color: #c33;
      border-left: 4px solid #c33;
    }

    .alert.success {
      background: #e8f5e9;
      color: #2e7d32;
      border-left: 4px solid #2e7d32;
    }

    .alert.warning {
      background: #fff3e0;
      color: #e65100;
      border-left: 4px solid #e65100;
    }

    .alert i {
      font-size: 20px;
    }

    /* IP Warning */
    .ip-warning {
      margin-top: 15px;
      padding: 10px;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      border-radius: 8px;
      color: #856404;
      font-size: 12px;
      display: none;
      align-items: center;
      gap: 8px;
    }

    .ip-warning.show {
      display: flex;
    }

    /* Device Info */
    .device-info {
      margin-top: 20px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 10px;
      font-size: 12px;
      color: #666;
    }

    .device-info i {
      margin-right: 5px;
      color: #667eea;
    }
  </style>
</head>
<body>
  <!-- Animated Background -->
  <div class="bg-animation">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
  </div>

  <!-- Login Container -->
  <div class="login-container">
    <div class="login-logo">
      <i class="fas fa-crown"></i>
      <h2>Admin Portal</h2>
      <p>Secure access control system</p>
    </div>

    <!-- Alert Messages -->
    <div id="alertMessage" class="alert">
      <i class="fas"></i>
      <span id="alertText"></span>
    </div>

    <!-- IP Warning -->
    <div id="ipWarning" class="ip-warning">
      <i class="fas fa-exclamation-triangle"></i>
      <span id="ipWarningText"></span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" onsubmit="event.preventDefault(); handleLogin()">
      <div class="form-group">
        <label><i class="fas fa-envelope"></i> Admin Email</label>
        <div class="input-group">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" placeholder="Enter admin email" required autocomplete="off">
        </div>
      </div>

      <div class="form-group">
        <label><i class="fas fa-lock"></i> Password</label>
        <div class="input-group">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" placeholder="Enter password" required>
          <i class="fas fa-eye toggle-password" onclick="togglePassword()"></i>
        </div>
      </div>

      <!-- Security Options -->
      <div class="security-options">
        <label class="remember-me">
          <input type="checkbox" id="rememberMe">
          <span>Remember this device</span>
        </label>
        <a href="#" class="forgot-password" onclick="forgotPassword()">Forgot Password?</a>
      </div>

      <!-- 2FA Section (shown when 2FA is enabled) -->
      <div id="twoFactorSection" class="two-factor-section">
        <h4>Two-Factor Authentication</h4>
        <p style="color: #666; font-size: 13px; margin-bottom: 15px;">Enter the 6-digit code from your authenticator app</p>
        <div class="otp-inputs">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, 1)" onkeydown="handleBackspace(this, event)">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, 2)" onkeydown="handleBackspace(this, event)">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, 3)" onkeydown="handleBackspace(this, event)">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, 4)" onkeydown="handleBackspace(this, event)">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, 5)" onkeydown="handleBackspace(this, event)">
          <input type="text" class="otp-input" maxlength="1" onkeyup="moveToNext(this, 6)" onkeydown="handleBackspace(this, event)">
        </div>
        <p style="text-align: center; font-size: 12px; color: #999;">
          <i class="fas fa-clock"></i> Code expires in <span id="timer">30</span>s
        </p>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <span class="btn-text"><i class="fas fa-sign-in-alt"></i> Secure Login</span>
        <span class="btn-loader"></span>
      </button>
    </form>

    <!-- Security Note -->
    <div class="security-note">
      <i class="fas fa-shield-alt"></i>
      <p>This area is restricted to authorized personnel only. All login attempts are logged and monitored.</p>
    </div>

    <!-- Device Info -->
    <div class="device-info" id="deviceInfo">
      <i class="fas fa-laptop"></i> Loading device information...
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC4nik_P57h9Ks8ryj0pG2xYNX-ePXKXtY",
      authDomain: "shoes-shopping-app-6a1d3.firebaseapp.com",
      databaseURL: "https://shoes-shopping-app-6a1d3-default-rtdb.firebaseio.com",
      projectId: "shoes-shopping-app-6a1d3",
      storageBucket: "shoes-shopping-app-6a1d3.appspot.com",
      messagingSenderId: "816065792865",
      appId: "1:816065792865:web:b1d58fab547f98e4961320",
      measurementId: "G-7BVQVYSMDF"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Login attempts tracking
    let loginAttempts = 0;
    const MAX_ATTEMPTS = 5;
    let lockoutUntil = null;
    let currentDevice = {};

    // Get device info on load
    window.addEventListener('load', async () => {
      await getDeviceInfo();
      checkStoredSession();
      startSessionMonitor();
    });

    // Get device information
    async function getDeviceInfo() {
      try {
        // Get IP info
        const response = await fetch('https://ipapi.co/json/');
        const data = await response.json();
        
        currentDevice = {
          ip: data.ip,
          city: data.city,
          region: data.region,
          country: data.country_name,
          device: navigator.userAgent,
          platform: navigator.platform,
          language: navigator.language
        };

        document.getElementById('deviceInfo').innerHTML = `
          <i class="fas fa-laptop"></i> 
          ${data.city}, ${data.country_name} | ${navigator.platform} | ${new Date().toLocaleString()}
        `;

        // Check if IP is blocked
        checkIPStatus(data.ip);
      } catch (error) {
        console.error('Error getting device info:', error);
      }
    }

    // Check if IP is blocked
    async function checkIPStatus(ip) {
      const snapshot = await db.collection('blockedIPs').where('ip', '==', ip).where('status', '==', 'blocked').get();
      
      if (!snapshot.empty) {
        document.getElementById('ipWarning').classList.add('show');
        document.getElementById('ipWarningText').innerHTML = `
          Warning: This IP address (${ip}) has been flagged. Please contact support if this is a mistake.
        `;
      }
    }

    // Check for stored session
    function checkStoredSession() {
      const remembered = localStorage.getItem('adminRemember');
      if (remembered) {
        document.getElementById('email').value = remembered;
        document.getElementById('rememberMe').checked = true;
      }
    }

    // Toggle password visibility
    function togglePassword() {
      const password = document.getElementById('password');
      const icon = document.querySelector('.toggle-password');
      
      if (password.type === 'password') {
        password.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        password.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // OTP input handling
    function moveToNext(input, nextIndex) {
      if (input.value.length === 1 && nextIndex < 6) {
        document.querySelectorAll('.otp-input')[nextIndex].focus();
      }
      
      // Check if all OTP fields are filled
      const otpInputs = document.querySelectorAll('.otp-input');
      const otp = Array.from(otpInputs).map(i => i.value).join('');
      if (otp.length === 6) {
        validateOTP(otp);
      }
    }

    function handleBackspace(input, event) {
      if (event.key === 'Backspace' && input.value.length === 0) {
        const prev = input.previousElementSibling;
        if (prev) {
          prev.focus();
        }
      }
    }

    // Show alert message
    function showAlert(type, message) {
      const alert = document.getElementById('alertMessage');
      const icon = alert.querySelector('.fa');
      const text = document.getElementById('alertText');
      
      alert.className = `alert ${type} show`;
      
      switch(type) {
        case 'error':
          icon.className = 'fas fa-exclamation-circle';
          break;
        case 'success':
          icon.className = 'fas fa-check-circle';
          break;
        case 'warning':
          icon.className = 'fas fa-exclamation-triangle';
          break;
      }
      
      text.textContent = message;
      
      setTimeout(() => {
        alert.classList.remove('show');
      }, 5000);
    }

    // Main login handler
    async function handleLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const rememberMe = document.getElementById('rememberMe').checked;
      const loginBtn = document.getElementById('loginBtn');

      // Check lockout
      if (lockoutUntil && new Date() < lockoutUntil) {
        const minutesLeft = Math.ceil((lockoutUntil - new Date()) / 60000);
        showAlert('error', `Too many failed attempts. Please try again in ${minutesLeft} minutes.`);
        return;
      }

      // Validate inputs
      if (!email || !password) {
        showAlert('error', 'Please enter both email and password');
        return;
      }

      // Show loading
      loginBtn.classList.add('loading');

      try {
        // Log login attempt
        await logLoginAttempt(email, 'pending');

        // Attempt login
        const userCredential = await auth.signInWithEmailAndPassword(email, password);
        const user = userCredential.user;

        // Check if user is admin
        const userDoc = await db.collection('users').doc(user.uid).get();
        
        if (!userDoc.exists || (userDoc.data().role !== 'admin' && userDoc.data().role !== 'super_admin')) {
          throw new Error('Unauthorized access');
        }

        const userData = userDoc.data();

        // Check if 2FA is enabled for this admin
        if (userData.twoFactorEnabled) {
          // Show 2FA section
          document.getElementById('twoFactorSection').classList.add('active');
          startOTPTimer();
          
          // Generate and send OTP (in production, send via email/authenticator)
          await generateAndSendOTP(user.uid);
          
          showAlert('success', 'Please enter the 2FA code sent to your device');
          loginBtn.classList.remove('loading');
          return;
        }

        // Check if this is a new device
        const isNewDevice = await checkNewDevice(user.uid, currentDevice);
        if (isNewDevice) {
          // Send notification about new device login
          await sendNewDeviceNotification(user.uid, currentDevice);
          showAlert('warning', 'New device detected. Verification email sent.');
        }

        // Complete login
        await completeLogin(user, userData, rememberMe);

      } catch (error) {
        console.error('Login error:', error);
        
        // Handle specific errors
        let errorMessage = 'Login failed. ';
        switch(error.code) {
          case 'auth/user-not-found':
          case 'auth/wrong-password':
            errorMessage += 'Invalid email or password.';
            loginAttempts++;
            break;
          case 'auth/too-many-requests':
            errorMessage += 'Too many failed attempts. Account temporarily locked.';
            lockoutUntil = new Date(Date.now() + 15 * 60000); // 15 minutes
            break;
          case 'auth/user-disabled':
            errorMessage += 'This account has been disabled.';
            break;

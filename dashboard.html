<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard - Cadbury Dairy Milk</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="../css/admin.css">
  
  <!-- Authentication Guard - MUST be first script -->
  <script src="auth-guard.js"></script>
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
  
  <style>
    /* Your existing admin styles */
  </style>
</head>
<body>
  <div class="admin-container">
    <!-- Sidebar -->
    <div class="admin-sidebar">
      <div class="admin-logo">
        <i class="fas fa-crown"></i> Admin Panel
      </div>
      
      <div class="admin-profile" id="adminProfile">
        <!-- Will be populated by JS -->
      </div>
      
      <div class="admin-menu">
        <a href="dashboard.html" class="menu-item active">
          <i class="fas fa-chart-pie"></i> Dashboard
        </a>
        <a href="users.html" class="menu-item">
          <i class="fas fa-users"></i> Users
        </a>
        <a href="products.html" class="menu-item">
          <i class="fas fa-box"></i> Products
        </a>
        <a href="investments.html" class="menu-item">
          <i class="fas fa-chart-line"></i> Investments
        </a>
        <a href="transactions.html" class="menu-item">
          <i class="fas fa-exchange-alt"></i> Transactions
        </a>
        <a href="referrals.html" class="menu-item">
          <i class="fas fa-sitemap"></i> Referrals
        </a>
        <a href="checkin.html" class="menu-item">
          <i class="fas fa-calendar-check"></i> Check-In
        </a>
        <a href="notifications.html" class="menu-item">
          <i class="fas fa-bell"></i> Notifications
        </a>
        <a href="security.html" class="menu-item">
          <i class="fas fa-shield-alt"></i> Security
        </a>
        <a href="roles.html" class="menu-item">
          <i class="fas fa-user-tag"></i> Roles
        </a>
      </div>
      
      <div class="admin-footer">
        <button onclick="logout()" class="logout-btn">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="admin-main">
      <div class="admin-header">
        <h1>Dashboard</h1>
        <div class="header-actions">
          <span class="date" id="currentDate"></span>
          <button class="btn-small" onclick="logout()">
            <i class="fas fa-sign-out-alt"></i> Logout
          </button>
        </div>
      </div>

      <!-- Rest of your dashboard content -->
      <div class="stats-grid" id="statsGrid">
        <!-- Stats will be loaded -->
      </div>
    </div>
  </div>

  <script>
    // Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyC4nik_P57h9Ks8ryj0pG2xYNX-ePXKXtY",
      authDomain: "shoes-shopping-app-6a1d3.firebaseapp.com",
      databaseURL: "https://shoes-shopping-app-6a1d3-default-rtdb.firebaseio.com",
      projectId: "shoes-shopping-app-6a1d3",
      storageBucket: "shoes-shopping-app-6a1d3.appspot.com",
      messagingSenderId: "816065792865",
      appId: "1:816065792865:web:b1d58fab547f98e4961320",
      measurementId: "G-7BVQVYSMDF"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Load admin data on page load
    window.addEventListener('load', () => {
      loadAdminData();
      loadDashboardData();
    });

    function loadAdminData() {
      try {
        const adminData = JSON.parse(sessionStorage.getItem('adminData'));
        if (adminData) {
          document.getElementById('adminProfile').innerHTML = `
            <div class="admin-avatar">
              <i class="fas fa-user-shield"></i>
            </div>
            <h4>${adminData.username || 'Admin'}</h4>
            <p>${adminData.role || 'Administrator'}</p>
            <small>${adminData.email}</small>
          `;
        }
      } catch (e) {
        console.error('Error loading admin data:', e);
      }
    }

    function loadDashboardData() {
      document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      // Load your dashboard stats
      const statsGrid = document.getElementById('statsGrid');
      // ... your stats loading code
    }

    function logout() {
      // Clear all session data
      sessionStorage.clear();
      localStorage.removeItem('adminSession');
      
      // Sign out from Firebase
      firebase.auth().signOut()
        .then(() => {
          window.location.href = 'login.html';
        })
        .catch(() => {
          window.location.href = 'login.html';
        });
    }
  </script>
</body>
</html>
